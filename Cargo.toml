[package]
name = "knobyte"
version = "0.9.3"
edition = "2021"
description = "Persistent project memory, neuro-symbolic code graphs, and vector intelligence for AI coding agents - 100% Rust"
authors = ["Knobyte Team"]
license = "MIT"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }

# Async runtime & Web server / SSE
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["tokio", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
async-stream = "0.3"
futures-util = "0.3"

# SQLite with FTS5
rusqlite = { version = "0.33", features = ["bundled", "bundled-full"] }

# CozoDB (Graph & Vector Datalog Engine) with pure-Rust Sled storage
cozo = { version = "0.7.6", default-features = false, features = ["storage-sled", "graph-algo"] }
ndarray = "0.15"

# AST Parsing (Tree-sitter)
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"

# Serialization & Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Hashing & Crypto
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
uuid = { version = "1.13", features = ["v4", "serde"] }

# File system & utilities
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
ignore = "0.4"
walkdir = "2.5"
colored = "3.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18.6"

[dev-dependencies]
tempfile = "3.17"
