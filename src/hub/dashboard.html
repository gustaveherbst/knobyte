<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="knobyte-version" content="__VERSION__">
    <title>Knobyte Project Hub</title>
    <link rel="stylesheet" href="/assets/app.css">
    <script type="module" src="/assets/js/main.js"></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app" class="app" data-state="booting">
        <aside id="sidebar" class="sidebar" aria-label="Hub navigation">
            <div class="sidebar-head">
                <a class="brand" href="/" data-link>
                    <span class="brand-dot" aria-hidden="true"></span>
                    <span class="brand-text"><strong>Knobyte</strong><small>Project Hub</small></span>
                </a>
                <button type="button" class="icon-btn sidebar-close" id="sidebar-close" aria-label="Close navigation">&times;</button>
            </div>
            <button type="button" class="search-launch" id="search-launch">
                <span>Search project</span><kbd>/</kbd>
            </button>
            <nav id="nav" aria-label="Sections"></nav>
            <div class="sidebar-foot">
                <div class="foot-row"><span class="dot-ok" aria-hidden="true"></span><span>Runs locally</span></div>
                <div class="muted small">Shared records use git · v__VERSION__</div>
            </div>
        </aside>
        <div class="scrim" id="scrim" hidden></div>
        <div class="main-col">
            <header id="topbar" class="topbar">
                <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="topbar-repo" id="topbar-repo"></div>
                <div class="topbar-meta" id="topbar-meta"></div>
            </header>
            <main id="main" tabindex="-1"></main>
        </div>
    </div>
    <div id="dialogs"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
