name: Release

permissions:
  contents: write

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach to (e.g. v0.9.2)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-assets:
    name: Build & Upload (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # MacOS (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
          # Linux (amd64)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Linux (arm64)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # Windows (amd64)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup cross-toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build and upload release binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: knobyte
          target: ${{ matrix.target }}
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || (github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name) || github.ref) }}
          archive: $bin-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
