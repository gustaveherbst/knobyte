    <text x="36" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Overview</text>
    <circle cx="24" cy="80" r="3" fill="#38bdf8" />

    <text x="36" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Fleet Registry</text>
    <text x="36" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Tree-sitter Graph</text>
    <text x="36" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">CozoDB Vectors</text>
    <text x="36" y="205" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Wiki Documents</text>
    <text x="36" y="235" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Relays (Handoffs)</text>
    <text x="36" y="265" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Inbox Proposals</text>
    <text x="36" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Team Members</text>
    <text x="36" y="325" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Audit &amp; Activity</text>

