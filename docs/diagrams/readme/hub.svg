      <text x="151" y="58" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#e0f2fe" text-anchor="middle">ACTIVE</text>
      <text x="30" y="77" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Path: /workspace/projects/orion-platform • 100% Drift Health</text>
      <text x="415" y="68" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10b981">100.0%</text>

      <!-- Project Item 2 -->
