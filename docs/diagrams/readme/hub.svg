      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Drift Score</text>
      <text x="14" y="56" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#10b981">100.0%</text>
