          <text x="33" y="112" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Decisions</text>
          <text x="33" y="124" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">4</text>

          <rect x="74" width="66" height="28" rx="4" fill="#0f172a" />
          <text x="107" y="112" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Projects</text>
          <text x="107" y="124" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">2</text>

          <rect x="148" width="66" height="28" rx="4" fill="#0f172a" />
          <text x="181" y="112" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Relays</text>
          <text x="181" y="124" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle">1</text>
        </g>

        <!-- Click to inspect hint -->
        <rect x="16" y="155" width="248" height="110" rx="6" fill="#0f172a" stroke="#1f2937" stroke-width="1" />
        <text x="28" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Click-to-Inspect Drawer</text>
        <text x="28" y="200" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Breakdown of touched files</text>
        <text x="28" y="218" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Multi-project impact</text>
        <text x="28" y="236" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Claimed &amp; authored handoffs</text>
