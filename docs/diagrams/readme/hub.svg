      <text x="214" y="56" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#38bdf8">384</text>
      <text x="325" y="56" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">492 EDGES</text>

      <!-- Card 3 -->
      <rect x="400" width="185" height="75" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
      <text x="414" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">HNSW Embeddings</text>
      <text x="414" y="56" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#818cf8">128-dim</text>
      <text x="535" y="56" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">COZODB</text>

