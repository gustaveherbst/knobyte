        <circle cx="38" cy="68" r="16" fill="url(#avatarGrad)" />
        <text x="38" y="73" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
        <text x="64" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Alex Rivera</text>
        <text x="64" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">@alexrivera • active</text>

        <!-- Metric badges inside card -->
        <g transform="translate(24, 100)">
