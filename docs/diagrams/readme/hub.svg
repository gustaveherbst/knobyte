      <text x="151" y="116" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">SYNCED</text>
      <text x="30" y="135" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Path: /workspace/projects/aurora-service • 98.4% Drift Health</text>
      <text x="415" y="126" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10b981">98.4%</text>

