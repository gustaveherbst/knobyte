      <text x="16" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Audit Feed &amp; Decisions</text>
      <rect x="16" y="184" width="458" height="38" rx="4" fill="#0f172a" />
      <rect x="26" y="193" width="60" height="18" rx="3" fill="#1e3a8a" />
      <text x="56" y="206" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#93c5fd" text-anchor="middle">DECISION</text>
      <text x="96" y="207" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Core architecture initialized: modular event-driven service engine</text>

      <rect x="16" y="228" width="458" height="38" rx="4" fill="#0f172a" />
      <rect x="26" y="237" width="60" height="18" rx="3" fill="#065f46" />
      <text x="56" y="250" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">GROUND</text>
      <text x="96" y="251" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Synchronized 384 AST node anchors to graph baseline</text>

