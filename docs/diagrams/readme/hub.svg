    <path d="M 26 23 L 38 23 L 38 27 L 34 27 L 34 37 L 30 37 L 30 27 L 26 27 Z" fill="#ffffff" />
    <text x="54" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Project Hub</text>

    <!-- Nav Items -->
