<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" rx="12" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <text x="500" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">THE RELAY CONTEXT HANDOFF LIFECYCLE</text>

  <!-- Step 1: Draft -->
  <g transform="translate(40, 70)" filter="url(#shadow2)">
    <rect width="200" height="250" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="36" rx="8" fill="#1f2937" />
    <text x="16" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">1. Draft Relay</text>

    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Agent Context Capture</text>
    <rect x="14" y="74" width="172" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="98" font-family="monospace" font-size="10" fill="#93c5fd">• summary</text>
    <text x="24" y="118" font-family="monospace" font-size="10" fill="#cbd5e1">• tests executed</text>
    <text x="24" y="138" font-family="monospace" font-size="10" fill="#cbd5e1">• blockers found</text>
    <text x="24" y="158" font-family="monospace" font-size="10" fill="#cbd5e1">• next actions</text>
    <text x="24" y="178" font-family="monospace" font-size="10" fill="#94a3b8">• repo HEAD/branch</text>
    <text x="24" y="206" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Local Draft in .knobyte/local/</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 248 190 L 278 190" fill="none" stroke="#38bdf8" stroke-width="2" />
  <polygon points="278,186 286,190 278,194" fill="#38bdf8" />

  <!-- Step 2: Review & Publish -->
  <g transform="translate(290, 70)" filter="url(#shadow2)">
    <rect width="200" height="250" rx="8" fill="#111827" stroke="#0284c7" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="36" rx="8" fill="#0369a1" />
    <text x="16" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f0f9ff">2. Review &amp; Publish</text>

    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Human Approval</text>
    <rect x="14" y="74" width="172" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc">Hub Review Screen</text>
    <text x="24" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Review handoff details &amp; recipient list</text>
    <rect x="24" y="145" width="150" height="28" rx="4" fill="#0284c7" />
    <text x="99" y="163" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">knobyte relay publish</text>
    <text x="24" y="206" font-family="system-ui, sans-serif" font-size="9" fill="#34d399">Canonical .knobyte/relays/</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 498 190 L 528 190" fill="none" stroke="#6366f1" stroke-width="2" />
  <polygon points="528,186 536,190 528,194" fill="#6366f1" />

  <!-- Step 3: Git Sharing -->
  <g transform="translate(540, 70)" filter="url(#shadow2)">
    <rect width="200" height="250" rx="8" fill="#111827" stroke="#4f46e5" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="36" rx="8" fill="#312e81" />
    <text x="16" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e0e7ff">3. Git Push &amp; Pull</text>

    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#818cf8">Standard Git Layer</text>
    <rect x="14" y="74" width="172" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="102" font-family="monospace" font-size="10" fill="#c7d2fe">git add .knobyte/</text>
    <text x="24" y="124" font-family="monospace" font-size="10" fill="#c7d2fe">git commit -m "..."</text>
    <text x="24" y="146" font-family="monospace" font-size="10" fill="#c7d2fe">git push origin main</text>
    <text x="24" y="174" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Teammate pulls branch</text>
    <text x="24" y="206" font-family="system-ui, sans-serif" font-size="9" fill="#818cf8">Zero third-party services</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 748 190 L 778 190" fill="none" stroke="#10b981" stroke-width="2" />
  <polygon points="778,186 786,190 778,194" fill="#10b981" />

  <!-- Step 4: Claim & Resume -->
  <g transform="translate(790, 70)" filter="url(#shadow2)">
    <rect width="170" height="250" rx="8" fill="#111827" stroke="#059669" stroke-width="1.5" />
    <rect x="0" y="0" width="170" height="36" rx="8" fill="#065f46" />
    <text x="14" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ecfdf5">4. Claim &amp; Resume</text>

    <text x="14" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399">Continuity Achieved</text>
    <rect x="12" y="74" width="146" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#f8fafc">Sam claims Relay</text>
    <rect x="20" y="116" width="128" height="24" rx="4" fill="#047857" />
    <text x="84" y="132" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">relay acknowledge</text>
    <text x="20" y="162" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0">Agent reads context:</text>
    <text x="20" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Zero cold starts</text>
    <text x="20" y="206" font-family="system-ui, sans-serif" font-size="9" fill="#34d399">Closed upon finish</text>
  </g>
</svg>
