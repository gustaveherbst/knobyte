<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="inboxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="inboxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1000" height="360" rx="12" fill="url(#inboxBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <text x="500" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">INBOX: KNOWLEDGE CONTRIBUTION &amp; HUMAN REVIEW BOUNDARY</text>

  <!-- Step 1: Discovery & Local Draft -->
  <g transform="translate(40, 70)" filter="url(#inboxShadow)">
    <rect width="200" height="250" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="36" rx="8" fill="#1f2937" />
    <text x="16" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">1. Local Draft</text>

    <text x="16" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Engineering Discovery</text>
    <rect x="14" y="70" width="172" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="92" font-family="system-ui, sans-serif" font-size="10" fill="#f8fafc">Agent or engineer learns:</text>
    <text x="24" y="112" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">• New architectural pattern</text>
    <text x="24" y="128" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">• Edge case in payment retry</text>
    <text x="24" y="144" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">• Database pooling constraint</text>

    <rect x="22" y="165" width="156" height="26" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="30" y="182" font-family="monospace" font-size="8" fill="#38bdf8">knobyte inbox draft save</text>

    <text x="24" y="208" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Local in .knobyte/local/</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 248 190 L 278 190" fill="none" stroke="#38bdf8" stroke-width="2" />
  <polygon points="278,186 286,190 278,194" fill="#38bdf8" />

  <!-- Step 2: Published Proposal -->
  <g transform="translate(290, 70)" filter="url(#inboxShadow)">
    <rect width="200" height="250" rx="8" fill="#111827" stroke="#0284c7" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="36" rx="8" fill="#0369a1" />
    <text x="16" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f0f9ff">2. Publish Proposal</text>

    <text x="16" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Repository Proposal</text>
    <rect x="14" y="70" width="172" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="92" font-family="monospace" font-size="9" fill="#93c5fd">.knobyte/inbox/prop_1.md</text>
    <text x="24" y="114" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Title: Rate Limiting Policy</text>
    <text x="24" y="130" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Target: context/rate-limit.md</text>
    <text x="24" y="146" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Evidence: call graph trace</text>

    <rect x="22" y="165" width="156" height="26" rx="4" fill="#0284c7" />
    <text x="100" y="182" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">knobyte inbox publish</text>

    <text x="24" y="208" font-family="system-ui, sans-serif" font-size="9" fill="#38bdf8">Visible in Hub &amp; Git</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 498 190 L 528 190" fill="none" stroke="#f59e0b" stroke-width="2" />
  <polygon points="528,186 536,190 528,194" fill="#f59e0b" />

  <!-- Step 3: Human Review Boundary -->
  <g transform="translate(540, 70)" filter="url(#inboxShadow)">
    <rect width="200" height="250" rx="8" fill="#111827" stroke="#d97706" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="36" rx="8" fill="#78350f" />
    <text x="16" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fef3c7">3. Review Boundary</text>

    <text x="16" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f59e0b">Explicit Human Control</text>
    <rect x="14" y="70" width="172" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="92" font-family="system-ui, sans-serif" font-size="10" fill="#f8fafc">Project Hub Review Screen</text>
    <text x="24" y="112" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Inspect diff between proposal &amp; existing docs</text>

    <g transform="translate(24, 140)">
      <rect width="64" height="24" rx="4" fill="#059669" />
      <text x="32" y="156" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">APPROVE</text>

      <rect x="74" width="64" height="24" rx="4" fill="#dc2626" />
      <text x="106" y="156" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">REJECT</text>
    </g>

    <text x="24" y="208" font-family="system-ui, sans-serif" font-size="9" fill="#fde68a">No silent automated writes</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 748 190 L 778 190" fill="none" stroke="#10b981" stroke-width="2" />
  <polygon points="778,186 786,190 778,194" fill="#10b981" />

  <!-- Step 4: Canonical Memory -->
  <g transform="translate(790, 70)" filter="url(#inboxShadow)">
    <rect width="170" height="250" rx="8" fill="#111827" stroke="#059669" stroke-width="1.5" />
    <rect x="0" y="0" width="170" height="36" rx="8" fill="#065f46" />
    <text x="14" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ecfdf5">4. Merged Memory</text>

    <text x="14" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399">Canonical Knowledge</text>
    <rect x="12" y="70" width="146" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="94" font-family="system-ui, sans-serif" font-size="9" fill="#f8fafc">Merged into:</text>
    <text x="20" y="112" font-family="monospace" font-size="8" fill="#a7f3d0">.knobyte/context/</text>
    <text x="20" y="128" font-family="monospace" font-size="8" fill="#a7f3d0">rate-limit.md</text>

    <text x="20" y="152" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">Indexed to SQLite FTS5</text>
    <text x="20" y="168" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">Groundings updated</text>
    <text x="20" y="184" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">Committed via Git</text>

    <text x="20" y="208" font-family="system-ui, sans-serif" font-size="9" fill="#34d399">Durable &amp; queryable</text>
  </g>
</svg>
